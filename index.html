<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overwatch — Notas de Parche</title>
    <meta name="description"
        content="Notas de parche de Overwatch traducidas al español: juego base, Stadium, Arcade y corrección de errores.">
    <meta property="og:title" content="Overwatch — Notas de Parche">
    <meta property="og:description" content="Visualización de los parches de Overwatch">
    <meta name="theme-color" content="#080c14">

    <!-- Icono de la app -->
    <link rel="icon" type="image/png" sizes="64x64" href="icons/icon-64.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay" role="status" aria-live="polite">
        <img class="loader-logo" src="logo.svg" alt="Overwatch" draggable="false">
        <div class="loader-text">Cargando parche</div>
        <div class="loader-bar">
            <div class="loader-bar-inner"></div>
        </div>
    </div>

    <!-- Scrape Progress Overlay -->
    <div id="scrape-overlay" class="hidden" role="status" aria-live="polite">
        <div class="scrape-card cut">
            <div class="scrape-header">
                <img class="scrape-logo" src="logo.svg" alt="Overwatch" draggable="false">
                <div class="scrape-title-group">
                    <div class="scrape-title">Actualizando notas de parche</div>
                    <div class="scrape-subtitle">Descargando parches de Blizzard y traduciéndolos al español</div>
                </div>
            </div>

            <div class="scrape-body">
                <div class="scrape-progress-container">
                    <div class="scrape-progress-bar">
                        <div class="scrape-progress-inner" id="scrape-progress-inner"></div>
                    </div>
                    <span class="scrape-percent" id="scrape-percent">0%</span>
                </div>

                <div class="scrape-console" id="scrape-console">
                    <!-- Los logs se escribirán aquí en tiempo real -->
                </div>
            </div>

            <div class="scrape-footer hidden" id="scrape-footer">
                <button id="scrape-close-btn" class="scrape-btn cut">Aceptar</button>
            </div>
        </div>
    </div>


    <!-- Header -->
    <header role="banner">
        <div class="header-brand">
            <img class="header-logo" src="logo.svg" alt="" draggable="false">
            <span class="header-title">Patch Notes <small>OW</small></span>
        </div>

        <!-- Patch Selector -->
        <div class="patch-selector-wrap">
            <!-- Selector oculto: guarda el parche abierto. Se cambia desde la línea temporal. -->
            <select id="patch-select" aria-hidden="true" tabindex="-1" hidden>
                <option>Cargando...</option>
            </select>
            <button id="refresh-btn" class="icon-btn refresh-btn cut" title="Refrescar y forzar descarga completa del parche actual"
                aria-label="Refrescar el parche actual"><i data-icon="refresh" data-size="17"></i></button>
            <button id="update-btn" class="icon-btn refresh-btn cut" title="Buscar nuevos parches (descarga y traduce solo lo nuevo)"
                aria-label="Buscar nuevos parches"><i data-icon="download" data-size="17"></i></button>
        </div>

        <div class="header-spacer"></div>

        <!-- Search -->
        <div class="search-wrap cut" role="search">
            <i data-icon="search" data-size="17" class="search-icon"></i>
            <input id="search-input" type="search" placeholder="Buscar héroe..." autocomplete="off"
                aria-label="Buscar héroe">
        </div>

        <!-- Enlace a las notas de parche oficiales de Blizzard -->
        <a id="official-link" class="official-link cut" href="https://overwatch.blizzard.com/es-es/news/patch-notes/"
            target="_blank" rel="noopener" title="Abrir las notas de parche oficiales de Blizzard">
            <i data-icon="external" data-size="16"></i><span>Notas oficiales</span>
        </a>

        <!-- Language Toggle: traducción / texto original en inglés -->
        <button id="lang-toggle-btn" class="lang-toggle-btn cut" title="Ver el texto original en inglés"
            aria-label="Ver el texto original en inglés" aria-pressed="false" disabled>
            <span class="lang-opt" data-lang="es">ES</span><span class="lang-opt" data-lang="en">EN</span>
        </button>

        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="icon-btn theme-toggle-btn cut" title="Cambiar tema" aria-label="Cambiar tema">
            <i data-icon="sun" data-size="17" class="theme-ic-sun"></i>
            <i data-icon="moon" data-size="17" class="theme-ic-moon"></i>
        </button>

        <!-- Mobile Menu Toggle -->
        <button id="mobile-filter-toggle-btn" class="icon-btn mobile-filter-toggle-btn cut" title="Parches" aria-label="Abrir la lista de parches">
            <i data-icon="menu" data-size="18"></i>
        </button>
    </header>

    <!-- App Layout: línea temporal · contenido · índice -->
    <div class="app-layout">
        <nav class="sidebar" id="sidebar" role="navigation" aria-label="Parches">
            <!-- Injected by app.js -->
        </nav>

        <main class="content" id="content" role="main">
            <!-- Injected by app.js -->
        </main>

        <aside class="toc" id="toc" aria-label="Héroes de este parche">
            <!-- Injected by app.js -->
        </aside>

        <!-- Drawer Overlay -->
        <div id="drawer-overlay" class="drawer-overlay"></div>
    </div>

    <script>
        // Tema: oscuro por defecto. Se aplica antes de cargar los módulos para evitar parpadeos.
        (function() {
            function applyTheme(isLight) {
                document.body.classList.toggle('light-theme', isLight);
                document.documentElement.style.colorScheme = isLight ? 'light' : 'dark';
                document.querySelectorAll('img').forEach(function(img) {
                    if (img.classList.contains('loader-logo') || img.classList.contains('scrape-logo') ||
                        img.classList.contains('header-logo')) {
                        img.src = isLight ? 'logo-light.svg' : 'logo.svg';
                    }
                });
            }

            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'light') applyTheme(true);
            } catch(e) {}

            var btn = document.getElementById('theme-toggle-btn');
            if (btn) {
                btn.addEventListener('click', function() {
                    var isLight = !document.body.classList.contains('light-theme');
                    try { localStorage.setItem('theme', isLight ? 'light' : 'dark'); } catch(e) {}
                    applyTheme(isLight);
                });
            }
        })();
    </script>
    <script type="module" src="app.js"></script>
</body>

</html>
