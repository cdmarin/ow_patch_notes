name: Scrape Overwatch Patch Notes

on:
  schedule:
    - cron: '10 18 * * *' # Se ejecuta automáticamente todos los días a las 18:10 UTC (20:10 hora de España)
  workflow_dispatch: # Permite que ejecutes el scraper manualmente desde el panel de GitHub en cualquier momento
    inputs:
      months:
        description: 'Meses anteriores a reprocesar, separados por espacios (ej: "2026/05 2026/06"). Los parches con traducción automática se sustituyen por la oficial de Blizzard. Vacío = solo el parche actual.'
        required: false
        default: ''

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso crucial para que el bot pueda subir los JSON modificados al repositorio
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper dependencies
        run: npm run install-deps

      - name: Run scraper
        run: node scraper/scraper.js

      - name: Reprocess previous months
        if: ${{ github.event.inputs.months != '' }}
        env:
          MONTHS: ${{ github.event.inputs.months }}
        run: |
          for month in $MONTHS; do
            if [[ ! "$month" =~ ^[0-9]{4}/[0-9]{2}$ ]]; then
              echo "Formato de mes no válido: $month (usa AAAA/MM)"
              exit 1
            fi
            node scraper/scraper.js --url="https://overwatch.blizzard.com/en-us/news/patch-notes/live/$month"
          done

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          
          # Solo hacer commit y push si hay archivos JSON nuevos o modificados
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar notas de parche y traducciones [skip ci]"
            git push
          else
            echo "No se detectaron nuevos parches. Todo actualizado."
          fi
